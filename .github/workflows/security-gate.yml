name: Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  signup-flow:
    name: Signup flow invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run signup security gate
        run: node scripts/security-gate.mjs

  money-maths:
    name: Platform fee maths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run fee tests
        run: npm test

  authorisation:
    name: Authorisation invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check every server function is guarded
        run: node scripts/authorisation-gate.mjs
